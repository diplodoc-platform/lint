# ⚠️ IMPORTANT: This workflow is a template from diplodoc/infra/scaffolding
# Do not edit this file in consumer repositories. It is distributed by @diplodoc/infra.

name: Dependency Deep Verification

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  classify-dependency-diff:
    name: Classify Dependency Diff
    runs-on: ubuntu-latest
    outputs:
      has-dependency-changes: ${{ steps.decision.outputs.has-dependency-changes }}
      profile: ${{ steps.decision.outputs.profile }}
      risk: ${{ steps.decision.outputs.risk }}
      run-deep: ${{ steps.decision.outputs.run-deep }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Install locked dependencies safely
        run: npm ci --ignore-scripts

      - name: Resolve @diplodoc/infra
        id: infra
        run: |
          if [ -f "scripts/dependency-policy-review.js" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f "node_modules/@diplodoc/infra/scripts/dependency-policy-review.js" ]; then
            echo "path=node_modules/@diplodoc/infra" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to resolve @diplodoc/infra dependency policy tooling"
            exit 1
          fi

      - name: Extract base and head dependency manifests
        run: |
          git show "${{ github.event.pull_request.base.sha }}:package.json" > /tmp/before-pkg.json 2>/dev/null || echo '{}' > /tmp/before-pkg.json
          git show "${{ github.event.pull_request.head.sha }}:package.json" > /tmp/after-pkg.json
          git show "${{ github.event.pull_request.base.sha }}:package-lock.json" > /tmp/before-lock.json 2>/dev/null || echo '{}' > /tmp/before-lock.json
          git show "${{ github.event.pull_request.head.sha }}:package-lock.json" > /tmp/after-lock.json 2>/dev/null || echo '{}' > /tmp/after-lock.json

      - name: Classify dependency changes
        env:
          INFRA_PATH: ${{ steps.infra.outputs.path }}
        run: |
          mkdir -p artifacts/dependency-deep-verification
          node "${INFRA_PATH}/scripts/dependency-policy-review.js" \
            --registry "${INFRA_PATH}/dependency-policy.yml" \
            --before-pkg /tmp/before-pkg.json \
            --after-pkg /tmp/after-pkg.json \
            --before-lock /tmp/before-lock.json \
            --after-lock /tmp/after-lock.json \
            --repo "${{ github.event.repository.name }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --comment artifacts/dependency-deep-verification/assessment.md \
            --json artifacts/dependency-deep-verification/assessment.json \
            --quiet

      - name: Export verification decision
        id: decision
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assessment = JSON.parse(
              fs.readFileSync('artifacts/dependency-deep-verification/assessment.json', 'utf8'),
          );
          const deepProfiles = new Set([
              'document-transform',
              'document-rendering',
              'ecosystem',
          ]);
          if (assessment.hasDependencyChanges !== true && assessment.summary.total !== 0) {
              throw new Error('Inconsistent dependency assessment');
          }
          const output = [
              `has-dependency-changes=${assessment.hasDependencyChanges}`,
              `profile=${assessment.verificationProfile}`,
              `risk=${assessment.maxRisk}`,
              `run-deep=${assessment.hasDependencyChanges && deepProfiles.has(assessment.verificationProfile)}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, output.join('\n') + '\n');
          fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `Dependency changes: \`${assessment.summary.total}\`\n\nRisk: \`${assessment.maxRisk}\`\n\nProfile: \`${assessment.verificationProfile}\`\n\n`,
          );
          NODE

      - name: Upload verification decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-deep-decision-${{ github.event.pull_request.number }}
          path: artifacts/dependency-deep-verification/
          if-no-files-found: error
          retention-days: 7

  deep-verification:
    name: Run Selected Deep Profile
    needs: classify-dependency-diff
    if: needs.classify-dependency-diff.outputs.run-deep == 'true'
    uses: diplodoc-platform/testpack/.github/workflows/downstream-check.yml@master
    with:
      package: ${{ github.event.repository.name }}
      pr-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      profile: ${{ needs.classify-dependency-diff.outputs.profile }}
