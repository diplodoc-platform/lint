# To modify this workflow, edit it in devops/infra/scaffolding/.github/workflows/
# and then run the scaffolding update process.

name: Dependency Policy Check

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  dependency-policy-check:
    name: Dependency Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Install locked dependencies safely
        run: npm ci --ignore-scripts

      - name: Resolve @diplodoc/infra
        id: infra
        run: |
          if [ -f "scripts/enforce-exact-pin.js" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -d "node_modules/@diplodoc/infra" ]; then
            echo "path=node_modules/@diplodoc/infra" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run exact-pin enforcement
        run: |
          git show "${{ github.event.pull_request.base.sha || github.event.before }}:package.json" > /tmp/base-package.json 2>/dev/null || echo '{}' > /tmp/base-package.json
          node "${{ steps.infra.outputs.path || 'node_modules/@diplodoc/infra' }}/scripts/enforce-exact-pin.js" \
            --base-package /tmp/base-package.json \
            --package ./package.json \
            --registry "${{ steps.infra.outputs.path || 'node_modules/@diplodoc/infra' }}/dependency-policy.yml"
