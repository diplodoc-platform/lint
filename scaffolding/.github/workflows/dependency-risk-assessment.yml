# Do not edit this file in other packages - it is automatically copied from here.
# To modify this workflow, edit it in devops/infra/scaffolding/.github/workflows/
# and then run the scaffolding update process.

name: Dependency Risk Assessment

on:
  pull_request:
    branches: ['**']
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-risk-assessment:
    name: Dependency Risk Assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Resolve @diplodoc/infra
        id: infra
        run: |
          if [ -f "scripts/dependency-policy-review.js" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -d "node_modules/@diplodoc/infra" ]; then
            echo "path=node_modules/@diplodoc/infra" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies (fallback)
        if: steps.infra.outputs.path == ''
        run: npm ci --ignore-scripts

      - name: Extract base and head package.json / lockfile
        id: files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          INFRA_PATH="${{ steps.infra.outputs.path || 'node_modules/@diplodoc/infra' }}"

          git show "${BASE_SHA}:package.json" > /tmp/before-pkg.json 2>/dev/null || echo '{}' > /tmp/before-pkg.json
          git show "${HEAD_SHA}:package.json" > /tmp/after-pkg.json

          git show "${BASE_SHA}:package-lock.json" > /tmp/before-lock.json 2>/dev/null || echo '{}' > /tmp/before-lock.json
          git show "${HEAD_SHA}:package-lock.json" > /tmp/after-lock.json 2>/dev/null || echo '{}' > /tmp/after-lock.json

          echo "infra-path=${INFRA_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run dependency risk assessment
        run: |
          mkdir -p artifacts/dependency-risk
          node "${{ steps.files.outputs.infra-path }}/scripts/dependency-policy-review.js" \
            --registry "${{ steps.files.outputs.infra-path }}/dependency-policy.yml" \
            --before-pkg /tmp/before-pkg.json \
            --after-pkg /tmp/after-pkg.json \
            --before-lock /tmp/before-lock.json \
            --after-lock /tmp/after-lock.json \
            --head-sha ${{ github.event.pull_request.head.sha }} \
            --pr ${{ github.event.pull_request.number }} \
            --comment artifacts/dependency-risk/comment.md
          printf '{"pr":%s,"headSha":"%s"}\n' \
            '${{ github.event.pull_request.number }}' \
            '${{ github.event.pull_request.head.sha }}' \
            > artifacts/dependency-risk/metadata.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f artifacts/dependency-risk/comment.md ]; then
            cat artifacts/dependency-risk/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload risk assessment for trusted comment workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-risk-${{ github.event.pull_request.number }}
          path: artifacts/dependency-risk/
          if-no-files-found: error
          retention-days: 7
